<!doctype html>
<html lang="fi" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a45">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Eagle Eye – Uusi Era</title>
<style>
/* ===== Eagle Eye design system =====
   Neutral slate surfaces, one navy brand colour, one blue action colour,
   muted semantic status colours, Inter typography, 8px spacing grid. */
:root{
 --brand:#0b2a45;--brand-2:#123a5c;--gold:#d9a23a;
 --accent:#1d5fa8;--accent-h:#174e8c;--accent-soft:#eaf1fa;
 --bg:#f5f7fa;--surface:#fff;--subtle:#f8fafc;
 --line:#e3e8ef;--line-2:#eef2f6;
 --text:#0f1b2a;--text-2:#344256;--muted:#64748b;
 --ok:#15803d;--ok-bg:#ecf8f0;--good:#0e7490;--good-bg:#e8f5f8;--fair:#b45309;--fair-bg:#fdf4e7;--poor:#b91c1c;--poor-bg:#fdeeee;
 --r:10px;--r-sm:6px;--shadow:0 1px 2px rgba(16,24,40,.05);--shadow-lg:0 12px 32px rgba(16,24,40,.14);
 --side:248px;
 font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-feature-settings:"cv11","ss01";color:var(--text);background:var(--bg)
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- app frame ---- */
.app{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--brand);color:#c9d6e3;display:flex;flex-direction:column;z-index:30}
.side .brand{padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;min-width:0}
.brand svg{width:32px;height:32px;flex:none}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;color:#8fa6bd;font-size:12px;font-weight:500}
.snav{flex:1;overflow-y:auto;padding:14px 12px}
.snav .grp{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#7f97ae;padding:14px 10px 6px}
.snav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-sm);color:#c9d6e3;text-decoration:none;font-weight:500;margin-bottom:2px}
.snav a:hover{background:rgba(255,255,255,.06);color:#fff}
.snav a.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.snav a .ic{opacity:.85}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.side-foot .who{flex:1;min-width:0}
.side-foot .who b{display:block;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who small{display:block;color:#8fa6bd;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:none;border:0;color:inherit;width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.side .icon-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.content{margin-left:var(--side);min-width:0}
.topbar{position:sticky;top:0;z-index:20;height:60px;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px}
.topbar .ctx{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ctx b{color:var(--text);font-weight:600}
.topbar .brand{display:none;color:var(--brand)}
.topbar .brand small{color:var(--muted)}
.top-r{display:flex;gap:6px;align-items:center}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--text-2);border-radius:var(--r-sm);padding:0 10px;height:34px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-decoration:none;letter-spacing:.02em}
.chip:hover{background:var(--subtle)}
.m-only{display:none!important}
.lang-seg{display:inline-flex;background:var(--line-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:1px;height:34px}
.lang-seg button{border:0;background:none;border-radius:4px;padding:0 7px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.lang-seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.wrap{max-width:1240px;margin:0 auto;padding:28px 28px 40px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 28px;max-width:720px;margin:0 auto}
.tabs{display:none}

@media(max-width:899px){
 .side{display:none}
 .content{margin-left:0}
 .topbar{padding:0 16px;padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top))}
 .topbar .ctx{display:none}
 .topbar .brand{display:flex}
 .topbar .brand small{white-space:nowrap}
 .top-r{gap:4px}
 .chip{padding:0 7px}
 .lang-seg button{padding:0 5px}
 .m-only{display:inline-flex!important}
 .wrap{padding:18px 16px 24px}
 .foot{padding-bottom:96px}
 .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:25;box-shadow:0 -4px 16px rgba(16,24,40,.06)}
 .tabs a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-size:10px;letter-spacing:-.1px;font-weight:600}
 .tabs a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .tabs a.on{color:var(--accent)}
 .tabs a.on .ic{stroke-width:2.4}
 .tabs a.nav-settings{display:none}
}

/* ---- page structure ---- */
.pg-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pg-h h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.pg-h p{margin:4px 0 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;justify-content:flex-end;min-width:min(100%,300px)}
.filters .sel{width:auto;flex:0 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:14px;font-weight:600;margin:0 0 14px;color:var(--text);letter-spacing:-.005em}
.card h3{font-size:13px;font-weight:600;margin:20px 0 8px;color:var(--text-2)}
.center{text-align:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.kpis{display:grid;gap:16px;grid-template-columns:repeat(2,1fr);margin-bottom:16px}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:28px;font-weight:700;margin:6px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.kpi .s{font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:22px}
.two{display:grid;gap:0 16px}
.two>*{min-width:0}
@media(min-width:1000px){.two{grid-template-columns:1fr 1fr}.two.wide{grid-template-columns:3fr 2fr}}
.muted{color:var(--muted)}.small{font-size:12.5px}

/* ---- controls ---- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;text-decoration:none;color:var(--text-2);font-weight:600;font-size:13.5px;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{background:var(--subtle);border-color:#d3dbe5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn.danger{color:var(--poor);border-color:#f2d0d0}
.btn.danger:hover{background:var(--poor-bg)}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
.btn .ic{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.center .btns{justify-content:center}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:600;text-decoration:none;display:inline-block;font-size:13px}
.link:hover{text-decoration:underline}
.input,select,textarea{width:100%;border:1px solid #d3dbe5;border-radius:var(--r-sm);padding:0 12px;background:var(--surface);height:38px;font-size:14px;box-shadow:var(--shadow)}
textarea{resize:vertical;padding:9px 12px;height:auto;min-height:38px}
.input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,95,168,.15)}
label.f{display:block;font-size:12.5px;font-weight:600;margin:0 0 6px;color:var(--text-2)}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-sm);padding:2px 8px;font-size:12px;font-weight:600;background:var(--line-2);color:var(--text-2);white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.g-excellent,.st-fixed{background:var(--ok-bg);color:var(--ok)}
.g-good{background:var(--good-bg);color:var(--good)}
.g-fair,.st-progress{background:var(--fair-bg);color:var(--fair)}
.g-poor,.st-open{background:var(--poor-bg);color:var(--poor)}
.g-none::before{display:none}
.delta{font-size:12px;font-weight:600;color:var(--muted)}.delta.up{color:var(--ok)}.delta.down{color:var(--poor)}

/* ---- site search ---- */
.combo{position:relative;flex:1 1 260px;min-width:0;max-width:420px}
.card .combo{max-width:none}
.combo .input{padding-left:36px}
.combo>.ic{position:absolute;left:11px;top:10px;color:var(--muted);pointer-events:none;width:17px;height:17px}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);list-style:none;margin:0;padding:6px;max-height:min(360px,55vh);overflow:auto;z-index:40}
.combo-list li{padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.combo-list li strong{font-weight:600}
.combo-list li small{display:block;color:var(--muted);font-size:12px}
.combo-list li.act,.combo-list li:hover{background:var(--accent-soft)}
.combo-list li.cur strong::after{content:" ✓";color:var(--accent)}
.combo-list li.none{color:var(--muted);cursor:default}
mark{background:#fdecc8;color:inherit;border-radius:2px;padding:0 1px}

/* ---- lists, bars, charts ---- */
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border:0;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit;width:100%;background:none;text-align:left;cursor:pointer;font-size:14px}
.list-row:last-child{border-bottom:0}
.list-row strong{font-weight:600}
.list-row:hover strong{color:var(--accent)}
.bar-row{display:grid;grid-template-columns:minmax(90px,40%) 1fr 58px;gap:12px;align-items:center;margin:10px 0;font-size:13px}
.bar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.bar-l a{color:inherit;text-decoration:none}.bar-l a:hover{color:var(--accent)}
.bar-t{position:relative;height:8px;background:var(--line-2);border-radius:4px}
.bar-f{height:100%;border-radius:4px}
.bar-tg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px;opacity:.55}
.bar-v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
@media(max-width:520px){.bar-row{grid-template-columns:1fr 58px;gap:4px 12px;margin:12px 0}.bar-l{grid-column:1/-1}}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:12px;fill:#7a8799;font-family:inherit}
.chart text.tg{fill:#8a5a0f;font-weight:600}
.spark{width:110px;height:30px}

/* ---- inspection ---- */
.item{padding:16px}
.item.flag{border-color:#f1c8c8;background:#fffbfb}
.item.pulse{animation:pulse 1.4s}
@keyframes pulse{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 4px rgba(185,28,28,.25)}}
.item-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:12px}
.item-h strong{font-weight:600}
.wchip{font-size:11.5px;color:var(--muted);white-space:nowrap;background:var(--line-2);border-radius:var(--r-sm);padding:2px 8px;font-weight:600}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:560px}
.sc{border:1px solid #d3dbe5;background:var(--surface);border-radius:var(--r-sm);height:44px;font-weight:600;cursor:pointer;font-size:15px;padding:0;color:var(--text-2);font-variant-numeric:tabular-nums}
.sc:hover{border-color:var(--accent);color:var(--accent)}
.sc.na{font-size:12px}
.sc.on{color:#fff;border-color:transparent}
.sc.s0.on,.sc.s1.on{background:var(--poor)}.sc.s2.on{background:#c2410c}.sc.s3.on{background:var(--fair)}.sc.s4.on{background:var(--good)}.sc.s5.on{background:var(--ok)}.sc.na.on{background:#64748b}
.item-x{margin-top:12px;display:grid;gap:8px}
.photo-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scorebar{position:sticky;bottom:16px;background:var(--brand);color:#fff;border-radius:var(--r);padding:10px 12px 10px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow-lg);z-index:15;margin-top:16px}
.scorebar b{font-size:22px;font-variant-numeric:tabular-nums;font-weight:700}
.scorebar small{display:block;color:#9fb4c8;font-size:12px}
.scorebar .pill{background:rgba(255,255,255,.12);color:#fff}
@media(max-width:899px){.scorebar{bottom:76px}}
.area-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px;display:flex;justify-content:space-between}
.thumb{width:80px;height:80px;object-fit:cover;border-radius:var(--r-sm);cursor:zoom-in;border:1px solid var(--line);display:block}
.overlay{position:fixed;inset:0;background:rgba(8,18,30,.88);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;cursor:zoom-out}
.overlay img{max-width:100%;max-height:100%;border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--text);color:#fff;padding:11px 16px;border-radius:var(--r);z-index:120;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);font-weight:500;font-size:13.5px}
.toast.err{background:var(--poor)}
@media(min-width:900px){.toast{bottom:auto;top:72px}}
@media(max-width:899px){.toast{bottom:150px}}

/* ---- leaderboard ---- */
.lb{display:grid;gap:8px}
.lb-row{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.card .lb-row{box-shadow:none}
.lb-row:hover{border-color:#c5d3e3;background:var(--subtle)}
.lb-row strong{font-weight:600}
.rank{width:32px;height:32px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--text-2)}
.rank.r1{background:#f6e7c4;color:#7c5410;box-shadow:inset 0 0 0 1.5px var(--gold)}.rank.r2{background:#e7ecf2}.rank.r3{background:#f2e3d6;color:#7a4a1e}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.badge{font-size:11px;font-weight:600;border-radius:var(--r-sm);padding:2px 7px;background:#fbf1dc;color:#7c5410;display:inline-flex;gap:4px;align-items:center}
.badge .ic{width:12px;height:12px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.imp{background:var(--accent-soft);color:var(--accent)}.badge.mute{background:var(--line-2);color:var(--muted)}
.lb-score{text-align:right}.lb-score b{font-size:18px;display:block;font-variant-numeric:tabular-nums;font-weight:700}

/* ---- tables ---- */
.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th,.t td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--subtle);border-bottom-color:var(--line)}
.t tbody tr:hover td{background:#fafbfd}
.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .input{height:34px;box-shadow:none}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r-sm)}
.tbl .t tr:last-child td{border-bottom:0}

/* ---- login ---- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--surface)}
.login-hero{background:var(--brand);color:#c9d6e3;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-hero::after{content:"";position:absolute;right:-160px;bottom:-160px;width:460px;height:460px;border-radius:50%;border:70px solid rgba(217,162,58,.08)}
.login-hero h2{color:#fff;font-size:34px;line-height:1.15;letter-spacing:-.025em;margin:0 0 14px;max-width:460px;font-weight:700}
.login-hero p{font-size:15px;max-width:440px;margin:0 0 28px;color:#a9bccf}
.vp{list-style:none;padding:0;margin:0;display:grid;gap:14px;max-width:440px}
.vp li{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#dbe5ee}
.vp li .ic{color:var(--gold);margin-top:2px}
.login-hero small{color:#7f97ae;font-size:12px}
.login-main{display:grid;place-items:center;padding:40px 24px}
.login-card{width:100%;max-width:400px}
.login-card h1{font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
.login-card>p{color:var(--muted);margin:0 0 24px}
.role-card{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;background:var(--surface);color:inherit;box-shadow:var(--shadow)}
button.role-card{cursor:pointer}
button.role-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,95,168,.1)}
.role-ic{width:38px;height:38px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.role-card strong{font-size:15px;font-weight:600;display:block}
.role-card p{margin:2px 0 0;color:var(--muted);font-size:13px}
.role-card .grow{flex:1;min-width:0}
.login-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:20px}
@media(max-width:899px){.login{grid-template-columns:1fr}.login-hero{padding:28px 20px}.login-hero h2{font-size:24px}.login-hero p,.vp{display:none}.login-hero small{display:none}.login-hero::after{display:none}}

/* ---- misc ---- */
.chk-row{display:grid;grid-template-columns:22px 1fr 76px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.chk-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.chk-row .input{height:32px;padding:0 8px;box-shadow:none}
.det-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);align-items:flex-start}
.det-row:last-child{border-bottom:0}
.det-row .small{margin-top:4px}
.det-row .thumb{margin-top:8px}
.dots5{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.dots5 i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.dots5 i.on{background:var(--ok)}
.dots5.lo i.on{background:var(--poor)}.dots5.mid i.on{background:var(--fair)}
.insp-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.insp-head h1{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
.insp-head p{margin:0 0 10px}
.issue{padding:16px 18px}
.issue strong{font-weight:600}
.issue.od{box-shadow:inset 3px 0 0 var(--poor),var(--shadow)}
.row-b{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.seg{display:inline-flex;background:var(--line-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.site-card{display:block;text-decoration:none;color:inherit;margin:0;transition:border-color .15s,box-shadow .15s}
.site-card:hover{border-color:#c5d3e3;box-shadow:0 4px 14px rgba(16,24,40,.07)}
.site-card .row-b strong{font-size:14.5px;font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.report h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---- phase 1 additions ---- */
.kpis.k3{grid-template-columns:repeat(2,1fr)}
@media(min-width:1000px){.kpis.k3{grid-template-columns:repeat(3,1fr)}}
.quick{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r-sm)}
.area-h{align-items:center}
.area-h .btn{text-transform:none;letter-spacing:0}
.cause{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:var(--r-sm);padding:1px 7px;background:#eef1f6;color:var(--text-2);border:1px solid var(--line);vertical-align:1px}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--line-2);color:var(--text-2);font-size:12px;font-weight:700}
.att-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 8px;margin:0 -8px;width:calc(100% + 16px);border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;cursor:pointer;color:inherit;text-decoration:none;border-radius:var(--r-sm)}
.att-row:last-of-type{border-bottom:0}
.att-row:hover{background:var(--subtle)}
.att-row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.att-row strong{font-weight:600;font-size:13.5px}
.att-row>.ic:last-child{color:var(--muted);width:16px;height:16px}
.att-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.att-ic .ic{width:17px;height:17px}
.att-ic.poor{background:var(--poor-bg);color:var(--poor)}.att-ic.fair{background:var(--fair-bg);color:var(--fair)}.att-ic.mute{background:var(--line-2);color:var(--muted)}
.all-good{display:flex;gap:12px;align-items:center;padding:14px;background:var(--ok-bg);border-radius:var(--r-sm);color:var(--ok)}
.all-good span{display:flex;flex-direction:column}.all-good strong{color:var(--ok)}
.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 10px}
.sec-h .ic{width:16px;height:16px;color:var(--gold)}
details.adv>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.adv[open]>summary::before{transform:rotate(45deg)}
details.adv[open]>summary{margin-bottom:12px}
.modal{position:fixed;inset:0;background:rgba(8,18,30,.45);display:grid;place-items:center;z-index:110;padding:16px}
.modal-card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px}
.modal-card h2{margin:0;font-size:17px}
.modal-card h3{font-size:13px;margin:18px 0 6px;color:var(--text)}
.modal-card p{margin:0 0 8px;color:var(--text-2)}
.grades{display:flex;gap:6px;flex-wrap:wrap}
.icon-btn{color:var(--muted)}
.side .icon-btn{color:inherit}
.st-review{background:var(--accent-soft);color:var(--accent)}
.returned{margin:8px 0;padding:8px 10px;background:var(--fair-bg);color:var(--fair);border-radius:var(--r-sm);font-size:13px}
.after{margin:10px 0 4px;padding:10px 12px;background:var(--subtle);border:1px solid var(--line-2);border-radius:var(--r-sm)}
.pick{display:flex;gap:8px;margin-top:10px}.pick .input{flex:1;min-width:0}
body.busy{cursor:progress}body.busy .btn{opacity:.7}
.tabs a.nav-users{display:none}
@media print{
 .side,.topbar,.tabs,.no-print,.foot,.toast{display:none!important}
 .content{margin:0}
 body,.wrap{background:#fff;padding:0;max-width:none}
 .card,.kpi{break-inside:avoid;box-shadow:none;border-color:#ccc}
 .bar-f,.pill,.rank,.t th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

const V={};
// what a supervisor should act on today, most urgent first
function attention(ids){const scope=new Set(ids),rows=[];const iss=db.issues.filter(x=>scope.has(x.siteId));
 const od=iss.filter(overdue).sort((a,b)=>a.due.localeCompare(b.due));
 if(od.length)rows.push({k:'poor',i:'alert',h:t('attOverdue',od.length),s:od.slice(0,3).map(x=>siteName(x.siteId)+': '+(x.itemId?itemName(x.itemId):t('fromCustomer'))).join(' · '),act:'goIssues',arg:'overdue'});
 const rv=iss.filter(x=>x.status==='review');
 if(rv.length)rows.push({k:'fair',i:'check',h:t('attReview',rv.length),s:rv.slice(0,3).map(x=>siteName(x.siteId)).join(' · '),act:'goIssues',arg:'review'});
 const cu=iss.filter(x=>x.source==='customer'&&x.status==='open');
 if(cu.length)rows.push({k:'fair',i:'msg',h:t('attCustomer',cu.length),s:cu.slice(0,3).map(x=>siteName(x.siteId)).join(' · '),act:'goIssues',arg:'open'});
 const R=periodRange('last30');
 ids.map(id=>({s:site(id),v:avg(inspIn(R,new Set([id])).map(i=>i.score))})).filter(x=>x.v!=null&&x.v<x.s.target).sort((a,b)=>(a.v-a.s.target)-(b.v-b.s.target))
  .forEach(x=>rows.push({k:'fair',i:'building',h:t('attBelow',x.s.name),s:t('attBelowSub',fmtPct(x.v),x.s.target),href:'#/site/'+x.s.id}));
 if(isStaff())ids.map(id=>({s:site(id),l:lastInsp(id)})).filter(x=>!x.l||daysSince(x.l.date)>=14).sort((a,b)=>(a.l?.date||'').localeCompare(b.l?.date||''))
  .forEach(x=>rows.push({k:'mute',i:'check',h:t('attStale',x.s.name),s:x.l?t('lastInsp',fmtDate(x.l.date),daysSince(x.l.date)):t('noInspYet'),act:'startInsp',arg:x.s.id}));
 return rows}
function attentionCard(ids){const rows=attention(ids);
 return `<div class="card"><div class="row-b"><h2>${t('needsAttention')}</h2>${rows.length?`<span class="count">${rows.length}</span>`:''}</div>
 ${rows.length?rows.slice(0,8).map(r=>{const inner=`<span class="att-ic ${r.k}">${ic(r.i)}</span><span class="grow"><strong>${esc(r.h)}</strong><span class="muted small">${esc(r.s)}</span></span>${ic('arrow')}`;
  return r.href?`<a class="att-row" href="${r.href}">${inner}</a>`:`<button class="att-row" data-act="${r.act}" data-arg="${r.arg}">${inner}</button>`}).join('')+(rows.length>8?`<p class="muted small" style="margin:8px 0 0">${t('andMore',rows.length-8)}</p>`:'')
 :`<div class="all-good">${ic('ok')}<span><strong>${t('allGood')}</strong><span class="muted small">${t('allGoodSub')}</span></span></div>`}</div>`}
V.dashboard=()=>{
 const sites=mySites();const ids=ui.dashSite&&canSee(ui.dashSite)?[ui.dashSite]:sites.map(s=>s.id);const scope=new Set(ids);
 const months=last12();const trend=months.map(m=>avg(inspIn(periodRange(m),scope).map(i=>i.score)));const tgt=avg(ids.map(id=>site(id).target));
 const open=db.issues.filter(x=>scope.has(x.siteId)&&x.status!=='fixed');const od=open.filter(overdue).length;

 const trendCard=`<div class="card"><h2>${t('trend')}</h2>${lineChart(months.map(monthShort),[{name:t('avgScore'),values:trend,color:'#1d5fa8'}],{target:tgt})}</div>`;
 if(isCustomer()){const R=periodRange('last30'),PR=prevRange('last30');const cur=inspIn(R,scope);const a=avg(cur.map(i=>i.score)),pa=avg(inspIn(PR,scope).map(i=>i.score));

  return `<div class="pg-h"><div><h1>${t('customerWelcome',esc(custName(session.customerId)))}</h1><p class="muted small">${t('custLead')}</p></div><div class="filters">${siteCombo}</div></div>
  <div class="kpis k3">${kpi(t('last30Avg'),fmtPct(a),(a!=null&&tgt!=null?(a>=tgt?`<span class="delta up">${t('onTarget')}</span>`:`<span class="delta down">${t('belowTargetShort')}</span>`):'')+delta(a,pa))}
  ${kpi(t('openIssues'),open.length,od?`<span class="delta down">${t('overdueN',od)}</span>`:`<span class="muted">${t('noneOverdue')}</span>`)}${kpi(t('insp30'),cur.length,`<span class="muted">${t('target')} ${fmtPct(tgt)}</span>`)}</div>
  <div class="two wide">${trendCard}<div class="card"><div class="row-b"><h2>${t('openIssues')}</h2><a class="link small" href="#/issues">${t('viewAll')}</a></div>
  ${list.length?list.slice(0,5).map(x=>`<a class="list-row" href="#/issues"><div><strong>${x.itemId?esc(itemName(x.itemId)):t('fromCustomer')}</strong><div class="muted small">${esc(siteName(x.siteId))} · ${overdue(x)?`<span class="delta down">${t('isOverdue')}</span>`:t('due',fmtDate(x.due))}</div></div><span class="pill st-${x.status}">${t('status_'+x.status)}</span></a>`).join(''):`<p class="muted">${t('noIssues')}</p>`}
  <div class="btns" style="margin-top:14px"><a class="btn primary" href="#/feedback">${ic('msg')} ${t('feedbackTitle')}</a><a class="btn" href="#/reports">${ic('file')} ${t('reportTitle')}</a></div></div></div>`}
 const R=periodRange(ui.period),PR=prevRange(ui.period);const cur=inspIn(R,scope),prev=inspIn(PR,scope);
 const a=avg(cur.map(i=>i.score)),pa=avg(prev.map(i=>i.score));
 const below=ids.filter(id=>{const v=avg(cur.filter(i=>i.siteId===id).map(i=>i.score));return v!=null&&v<site(id).target}).length;
 const el=isAdmin()?cleanerStats(R,PR).filter(x=>x.eligible):[];
 return `<div class="pg-h"><div><h1>${t('nav_dashboard')}</h1></div><div class="filters">${siteCombo}${monthSelect('period',ui.period,true)}</div></div>
 ${isAdmin()&&!sites.length?`<div class="card"><h2>${t('emptyTitle')}</h2><p class="muted" style="margin-top:0">${t('emptyText')}</p><div class="btns"><a class="btn primary" href="#/siteEdit/new">${ic('plus')} ${t('addSite')}</a><a class="btn" href="#/settings">${t('settingsTitle')}</a></div></div>`:''}
 <div class="kpis">${kpi(t('avgScore'),fmtPct(a),gradePill(a)+delta(a,pa))}${kpi(t('inspections'),cur.length,`<span class="muted">${t('prevN',prev.length)}</span>`)}
 ${kpi(t('openIssues'),open.length,od?`<span class="delta down">${t('overdueN',od)}</span>`:'')}${kpi(t('belowTarget'),below,`<span class="muted">${t('sitesOf',below,ids.length)}</span>`)}</div>
 <div class="two wide">${attentionCard(ids)}${trendCard}</div>
 <div class="two">${isAdmin()?`<div class="card"><div class="row-b"><h2>${t('rewardEligible')} · ${ui.period==='last30'?t('last30'):monthLong(ui.period)}</h2><a class="link small" href="#/cleaners">${t('viewAll')}</a></div>${el.length?`<div class="lb">${el.slice(0,4).map(x=>lbRow(x,false)).join('')}</div>`:`<p class="muted">${t('noneEligible')}</p>`}</div>`:''}
 <div class="card"><div class="row-b"><h2>${t('recentInsp')}</h2><a class="link small" href="#/reports">${t('nav_reports')}</a></div>${cur.length?cur.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,6).map(inspRow).join(''):`<p class="muted">${t('noData')}</p>`}</div></div>`};

/* ---- inspection ---- */
function newDraft(sid){const s=site(sid);return {siteId:sid,cleanerId:s.cleanerId,inspector:store.get('ee_inspector','')||session.name||'',date:todayIso(),rep:'',notes:'',items:{}}}
const saveDraft=()=>store.set(dkey(),draft);
const dItem=id=>draft.items[id]||(draft.items[id]={});
function pickInspSite(id){if(draft&&draft.siteId===id)return;if(draft&&Object.keys(draft.items).length&&!confirm(t('confirmDiscard'))){render();return}draft=newDraft(id);saveDraft();render()}
function itemCard(id,w){const r=draft.items[id]||{};const v=r.v;const flag=typeof v==='number'&&v<=db.settings.issueAt;const open=flag||r.c||r.p||r.x;const nm=esc(itemName(id));
 return `<div class="card item${flag?' flag':''}" id="it-${id}"><div class="item-h"><strong>${nm}</strong><span class="wchip">${t('weight',w)}</span></div>
 <div class="scale" role="group" aria-label="${nm}">${[0,1,2,3,4,5].map(n=>`<button type="button" class="sc s${n}${v===n?' on':''}" data-act="rate" data-arg="${id}:${n}" aria-pressed="${v===n}">${n}</button>`).join('')}<button type="button" class="sc na${v==='na'?' on':''}" data-act="rate" data-arg="${id}:na" aria-pressed="${v==='na'}">${t('na')}</button></div>
 ${open?`<div class="item-x">${flag?`<div class="cause"><span class="small muted">${t('causeQ')}</span><div class="seg" role="group">${[['c','causeCleaning'],['m','causeMaint']].map(([k,l])=>`<button type="button" class="${(k==='m')===!!r.m?'on':''}" data-act="cause" data-arg="${id}:${k}" aria-pressed="${(k==='m')===!!r.m}">${t(l)}</button>`).join('')}</div></div>`:''}<textarea class="input" rows="2" data-in="itemComment" data-id="${id}" placeholder="${t('commentPh')}" aria-label="${t('commentPh')}">${esc(r.c||'')}</textarea><div class="photo-row"><label class="btn sm">${ic('camera')} ${t('photo')}<input type="file" accept="image/*" capture="environment" data-ch="itemPhoto" data-id="${id}" hidden></label>${r.p?`<img class="thumb" src="${r.p}" data-act="zoom" alt=""><button type="button" class="link" data-act="rmPhoto" data-arg="${id}">${t('removePhoto')}</button>`:''}</div></div>`:`<button type="button" class="link small" data-act="openX" data-arg="${id}">${t('addComment')}</button>`}</div>`}
function refreshCard(id){const el=document.getElementById('it-'+id);if(el)el.outerHTML=itemCard(id,site(draft.siteId).items[id])}
function liveScore(){const s=site(draft.siteId);let e=0,p=0,n=0;Object.entries(s.items).forEach(([id,w])=>{const v=draft.items[id]?.v;if(v===undefined)return;n++;if(v==='na')return;e+=v/5*w;p+=w});return {v:p?e/p*100:null,n,total:Object.keys(s.items).length}}
function updateLive(){const el=$('#liveScore');if(!el||!draft)return;const L=liveScore();el.textContent=fmtPct(L.v);$('#liveCount').textContent=t('rated',L.n,L.total);$('#liveGrade').outerHTML=`<span id="liveGrade">${L.v==null?'':gradePill(L.v)}</span>`}
V.inspect=()=>{
 if(ui.saved){const sv=ui.saved;ui.saved=null;const ins=db.inspections.find(i=>i.id===sv.id);
  if(ins)return `<div class="card center">${ring(ins.score,140)}<h1>${t('saved')}</h1><p><strong>${esc(siteName(ins.siteId))}</strong> · ${fmtDate(ins.date)} · ${esc(cleanerName(ins.cleanerId))}</p><p>${gradePill(ins.score)}</p><p class="muted">${t('issuesCreated',sv.n)}</p><div class="btns"><a class="btn" href="#/insp/${ins.id}">${t('open')}</a><button class="btn primary" data-act="newInsp">${ic('plus')} ${t('again')}</button></div></div>`}
 const head=`<div class="pg-h"><h1>${t('newInspection')}</h1>${draft?`<button class="btn sm danger" data-act="discard">${t('discardDraft')}</button>`:''}</div><div class="card"><label class="f">${t('site')}</label>${combo('inspSite',{value:draft?.siteId,onPick:pickInspSite})}</div>`;
 if(!draft){const rows=mySites().map(s=>({s,l:lastInsp(s.id)})).sort((x,y)=>(x.l?.date||'').localeCompare(y.l?.date||'')).slice(0,6);
  return head+`<p class="muted">${t('pickSiteFirst')}</p><div class="card"><h2>${t('awaiting')}</h2>${rows.map(({s,l})=>`<button class="list-row" data-act="startInsp" data-arg="${s.id}"><div><strong>${esc(s.name)}</strong><div class="muted small">${l?t('lastInsp',fmtDate(l.date),daysSince(l.date)):t('noInspYet')}</div></div>${l?scorePill(l.score):''}</button>`).join('')}</div>`}
 const s=site(draft.siteId);const ids=Object.keys(s.items);
 if(!ids.length)return head+`<div class="card">${t('noItems')} <a class="link" href="#/siteEdit/${s.id}">${t('edit')}</a></div>`;
 const cls=db.cleaners.filter(c=>c.active||c.id===draft.cleanerId);
 return head+`<div class="card"><p class="muted small" style="margin-top:0">${esc(s.address)} · ${esc(custName(s.customerId))} · ${t('target')} ${s.target} %</p><div class="fields">
  <div><label class="f" for="dCl">${t('cleaner')}</label><select id="dCl" class="input" data-in="draftField" data-f="cleanerId">${cls.map(c=>`<option value="${c.id}"${c.id===draft.cleanerId?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
  <div><label class="f" for="dIn">${t('inspector')} *</label><input id="dIn" class="input" data-in="draftField" data-f="inspector" value="${esc(draft.inspector)}" autocomplete="name"></div>
  <div><label class="f" for="dDa">${t('date')}</label><input id="dDa" type="date" class="input" data-in="draftField" data-f="date" value="${esc(draft.date)}" max="${todayIso()}"></div>
  <div><label class="f" for="dRe">${t('customerRep')}</label><input id="dRe" class="input" data-in="draftField" data-f="rep" value="${esc(draft.rep)}"></div></div>
  <div class="quick"><p class="muted small" style="margin:0">${t('quickHelp')}</p><button type="button" class="btn sm" data-act="allOk">${ic('ok')} ${t('allOk')}</button></div></div>
 ${areaGroups(ids).map(([a,list])=>`<div class="area-h"><span>${areaName(a)} · ${list.length}</span><button type="button" class="btn sm" data-act="areaOk" data-arg="${a}">${ic('ok')} ${t('areaOk')}</button></div>${list.map(id=>itemCard(id,s.items[id])).join('')}`).join('')}
 <div class="card"><label class="f" for="dNo">${t('notes')}</label><textarea id="dNo" class="input" rows="3" data-in="draftField" data-f="notes">${esc(draft.notes)}</textarea></div>
 <div class="scorebar"><div><small>${t('liveScore')}</small><b id="liveScore">–</b> <span id="liveGrade"></span><small id="liveCount"></small></div><button class="btn primary" data-act="saveInsp">${t('saveInspection')}</button></div>`};

V.insp=id=>{const ins=db.inspections.find(i=>i.id===id);if(!ins||!canSee(ins.siteId)||(isCleaner()&&ins.cleanerId!==session.cleanerId))return notFound();const s=site(ins.siteId);
 const rel=db.issues.filter(x=>x.inspectionId===id);
 return `<a class="link" href="${isCleaner()?'#/mine':'#/site/'+s.id}">← ${esc(s.name)}</a><div class="card insp-head">${ring(ins.score,110)}<div><h1>${esc(s.name)}</h1><p class="muted">${fmtDate(ins.date)} · ${t('cleaner')}: ${esc(cleanerName(ins.cleanerId))} · ${t('inspector')}: ${esc(ins.inspector)}${ins.rep?` · ${t('rep')}: ${esc(ins.rep)}`:''}</p>${gradePill(ins.score)} <span class="muted small">${t('target')} ${s.target} %</span></div></div>
 ${areaGroups(Object.keys(ins.items)).map(([a,list])=>{const sub={};list.forEach(k=>sub[k]=ins.items[k]);return `<div class="card"><div class="row-b"><h2>${areaName(a)}</h2>${scorePill(calcScore(sub))}</div>${list.map(k=>{const x=ins.items[k];return `<div class="det-row"><div><div>${esc(itemName(k))} <span class="muted small">· ${t('weight',x.w)}</span></div>${x.c?`<div class="small">${esc(x.c)}</div>`:''}${photoTag(x.p)}</div><div style="white-space:nowrap">${x.s==null?`<span class="pill">${t('na')}</span>`:`<span class="dots5 ${x.s<=2?'lo':x.s===3?'mid':''}">${[1,2,3,4,5].map(i=>`<i class="${i<=x.s?'on':''}"></i>`).join('')}</span><b>${x.s}</b>/5`}</div></div>`}).join('')}</div>`}).join('')}
 ${ins.notes?`<div class="card"><h2>${t('notes')}</h2><p style="margin:0">${esc(ins.notes)}</p></div>`:''}
 ${rel.length?`<div class="card"><h2>${t('nav_issues')}</h2>${rel.map(issueRow).join('')}</div>`:''}

/* ---- deviations ---- */
function issuePhoto(x){if(x.photo)return x.photo;const ins=x.inspectionId?db.inspections.find(i=>i.id===x.inspectionId):null;return (ins&&ins.items[x.itemId]?.p)||''}
function issueRow(x){const od=overdue(x),ph=issuePhoto(x);
 return `<div class="card issue${od?' od':''}"><div class="row-b"><div><strong>${x.itemId?esc(itemName(x.itemId)):t('fromCustomer')}</strong>${x.score!=null?` <span class="muted small">· ${t('score',x.score)}</span>`:''}${x.cat==='maintenance'?` <span class="tag">${t('causeMaint')}</span>`:''}<div class="muted small"><a class="link" style="padding:0" href="#/site/${x.siteId}">${esc(siteName(x.siteId))}</a> · ${t('created',fmtDate(x.created))} · ${t('cleaner')}: ${esc(cleanerName(x.cleanerId))}</div></div><span class="pill st-${x.status}">${t('status_'+x.status)}</span></div>
 ${x.comment?`<p style="margin:8px 0">${esc(x.comment)}</p>`:''}${x.rejectNote&&x.status!=='fixed'?`<p class="returned">${t('returnedNote')}: ${esc(x.rejectNote)}</p>`:''}${photoTag(ph,'margin:8px 0')}
 ${x.afterPhoto||x.cleanerNote?`<div class="after"><span class="small muted">${t('cleanerReport')}</span>${x.cleanerNote?`<p style="margin:2px 0 6px">${esc(x.cleanerNote)}</p>`:''}${photoTag(x.afterPhoto)}</div>`:''}
 <div class="row-b" style="align-items:center;flex-wrap:wrap;margin-top:6px"><span class="small">${x.status==='fixed'||x.status==='review'?t('fixedOn',fmtDate(x.fixedAt))+(x.fixedAt>x.due?` · <span class="delta down">${t('isOverdue')}</span>`:''):(od?`<b class="delta down">${t('isOverdue')}</b> · `:'')+t('due',fmtDate(x.due))}</span>
 ${isStaff()?`<span class="btns">${x.status==='review'?`<button class="btn sm" data-act="issueReject" data-arg="${x.id}">${t('sendBack')}</button><button class="btn sm primary" data-act="issueSet" data-arg="${x.id}:fixed">${t('confirmFix')}</button>`:`${isAdmin()?`<button class="btn sm" data-act="issueCat" data-arg="${x.id}" title="${t('causeQ')}">${x.cat==='maintenance'?t('toCleaning'):t('toMaint')}</button>`:''}${x.status==='open'?`<button class="btn sm" data-act="issueSet" data-arg="${x.id}:progress">${t('markProgress')}</button>`:''}${x.status!=='fixed'?`<button class="btn sm primary" data-act="issueSet" data-arg="${x.id}:fixed">${t('markFixed')}</button>`:`<button class="btn sm" data-act="issueSet" data-arg="${x.id}:open">${t('reopen')}</button>`}`}</span>`:''}</div></div>`}
V.issues=()=>{const scope=new Set(mySites().map(s=>s.id));let list=db.issues.filter(x=>scope.has(x.siteId));
 if(ui.issueSite&&scope.has(ui.issueSite))list=list.filter(x=>x.siteId===ui.issueSite);
 const cnt=k=>k==='all'?list.length:k==='overdue'?list.filter(overdue).length:list.filter(x=>x.status===k).length;
 const st=ui.issueStatus;list=st==='all'?list:st==='overdue'?list.filter(overdue):list.filter(x=>x.status===st);
 list.sort((a,b)=>st==='fixed'||st==='all'?(b.created.localeCompare(a.created)):(overdue(b)-overdue(a)||a.due.localeCompare(b.due)));
 return `<div class="pg-h"><h1>${t('nav_issues')}</h1><a class="btn primary sm" href="#/feedback">${ic('plus')} ${t('newIssue')}</a></div>
 <div class="filters" style="justify-content:flex-start;margin-bottom:14px"><div class="seg" role="group">${['open','progress','review','overdue','fixed','all'].map(k=>`<button class="${st===k?'on':''}" data-act="issueStatus" data-arg="${k}" aria-pressed="${st===k}">${k==='overdue'?t('isOverdue'):k==='all'?t('all'):t('status_'+k)} (${cnt(k)})</button>`).join('')}</div>${combo('issueSite',{value:ui.issueSite,allowAll:true,onPick:id=>{ui.issueSite=id;render()}})}</div>

/* ---- cleaners ---- */
// cleaners are judged on cscore (maintenance/supply faults removed) and only on cleaning deviations
const cScore=i=>i.cscore??i.score;
function cleanerStats(R,PR){const cur=inspIn(R),prev=inspIn(PR);const min=db.settings.minInsp;
 const rows=db.cleaners.map(c=>{const mine=cur.filter(i=>i.cleanerId===c.id),pm=prev.filter(i=>i.cleanerId===c.id);
  const iss=db.issues.filter(x=>x.cleanerId===c.id&&x.cat!=='maintenance'&&x.created>=R[0]&&x.created<=R[1]);const judged=iss.filter(x=>x.status==='fixed'||overdue(x));const ok=judged.filter(x=>x.status==='fixed'&&x.fixedAt<=x.due).length;
  const a=avg(mine.map(cScore)),pa=avg(pm.map(cScore));
  return {c,n:mine.length,a,pa,d:a!=null&&pa!=null?a-pa:null,issues:iss.length,onTime:judged.length?ok/judged.length*100:null,sites:new Set(mine.map(i=>i.siteId)).size,enough:mine.length>=min,eligible:mine.length>=min&&a!=null&&a>=db.settings.reward}})
  .filter(x=>x.c.active||x.n).sort((x,y)=>(y.enough-x.enough)||((y.a??-1)-(x.a??-1))||(y.n-x.n));
 const top=rows.find(x=>x.eligible);if(top)top.best=true;
 const imp=rows.filter(x=>x.enough&&x.d!=null&&x.d>=3).sort((x,y)=>y.d-x.d)[0];if(imp)imp.improved=true;return rows}
const initials=n=>String(n).replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function lbRow(x,full=true){return `<a class="lb-row" href="#/cleaner/${x.c.id}"><span class="rank${x.best?' r1':''}">${esc(initials(x.c.name))}</span><div><strong>${esc(x.c.name)}</strong>
 <div class="badges">${x.best?`<span class="badge">${ic('trophy')} ${t('cleanerOfMonth')}</span>`:''}${x.eligible&&!x.best?`<span class="badge ok">${ic('star')} ${t('rewardEligible')}</span>`:''}${x.improved?`<span class="badge imp">${ic('up')} ${t('mostImproved')}</span>`:''}${!x.enough?`<span class="badge mute">${t('notEnough')}</span>`:''}</div>
 ${full?`<div class="muted small" style="margin-top:4px">${t('inspN',x.n)} · ${t('sitesN',x.sites)} · ${t('devN',x.issues)}${x.onTime!=null?' · '+t('onTimeN',fmtNum(x.onTime,0)+' %'):''}</div>`:''}</div>
 <div class="lb-score"><b style="color:${gradeColor(x.a)}">${fmtPct(x.a)}</b>${delta(x.a,x.pa)}</div></a>`}

 <div class="card"><h2>${t('avgScore')} · ${monthLong(ui.cmonth)}</h2>${hbars(rows.filter(x=>x.a!=null).map(x=>({label:x.c.name,v:x.a,target:db.settings.reward,href:'#/cleaner/'+x.c.id})))}<p class="muted small">${t('fairNote')} ${t('inactiveHidden')}</p></div></div>`};

function resizeImage(file,max=900,q=.62){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.src=fr.result};fr.readAsDataURL(file)})}

 closeHelp(){$('.modal')?.remove()},
 goIssues(k){ui.issueStatus=k;ui.issueSite='';if(location.hash==='#/issues')render();else location.hash='#/issues'},
 issueStatus(k){ui.issueStatus=k;render()},
 // confirming a cleaner's report keeps the date they finished, so "on time" reflects their work, not the review
 async issueSet(arg){const [id,st]=arg.split(':');const x=db.issues.find(i=>i.id===id);if(!x)return;const keep=x.status==='review'&&x.fixedAt;x.status=st;x.fixedAt=st==='fixed'?(keep||todayIso()):'';if(await dbUpdate('issues',{id,status:st,fixedAt:x.fixedAt}))render()},
 async issueReject(id){const x=db.issues.find(i=>i.id===id);if(!x)return;const why=prompt(t('sendBackQ'));if(why===null)return;Object.assign(x,{status:'open',fixedAt:'',rejectNote:why.trim()});if(await dbUpdate('issues',{id,status:'open',fixedAt:'',rejectNote:x.rejectNote}))render()},
 async issueCat(id){const x=db.issues.find(i=>i.id===id);if(!x)return;x.cat=x.cat==='maintenance'?'cleaning':'maintenance';
  const ins=x.inspectionId&&db.inspections.find(i=>i.id===x.inspectionId);if(ins&&ins.items[x.itemId]){if(x.cat==='maintenance')ins.items[x.itemId].m=true;else delete ins.items[x.itemId].m;ins.cscore=calcScore(ins.items,true)}
  if(!await dbUpdate('issues',{id,cat:x.cat}))return;if(ins&&!await dbUpdate('inspections',{id:ins.id,items:ins.items,cscore:ins.cscore}))return;render()},
 taskOpen(id){ui.taskOpen=id||null;ui.taskPhoto='';render();if(id)$('#taskNote')?.focus()},
 async taskStart(id){const x=db.issues.find(i=>i.id===id);if(!x)return;x.status='progress';if(await dbUpdate('issues',{id,status:'progress'}))render()},
 async taskDone(id){const x=db.issues.find(i=>i.id===id);if(!x)return;let after='';try{after=await uploadPhoto(x.siteId,ui.taskPhoto)}catch(e){console.error(e);toast(t('saveOffline'),'err');return}
  const note=$('#taskNote')?.value.trim()||'';Object.assign(x,{status:'review',afterPhoto:after,cleanerNote:note,fixedAt:todayIso()});
  if(!await dbUpdate('issues',{id,status:'review',afterPhoto:after,cleanerNote:note,fixedAt:x.fixedAt}))return;ui.taskOpen=null;ui.taskPhoto='';toast(t('taskSent'));render()},
 reportFor(id){ui.fbSite=id;location.hash='#/feedback'},
 async sendFeedback(){const sid=ui.fbSite;const desc=$('#fbDesc').value.trim();if(!sid||!canSee(sid)){toast(t('pickSite'),'err');return}if(!desc){toast(t('needDesc'),'err');$('#fbDesc').focus();return}
  let photo='';try{photo=await uploadPhoto(sid,ui.fbPhoto)}catch(e){console.error(e);toast(t('saveOffline'),'err');return}
  const s=site(sid);const d=todayIso();const nw=({id:uid('d'),siteId:sid,inspectionId:'',itemId:'',score:null,cleanerId:s.cleanerId,comment:desc,photo,status:'open',created:d,due:iso(addDays(new Date(),db.settings.fixDays)),fixedAt:'',source:'customer',cat:'cleaning'});
  db.issues.push(nw);if(!await dbInsert('issues',nw)){db.issues.pop();return}ui.fbPhoto='';ui.issueStatus='open';ui.issueSite=sid;toast(t('feedbackSent'));location.hash='#/issues'},
 async saveSite(id){const f=$('#siteForm');const fd=new FormData(f);const name=String(fd.get('name')||'').trim();if(!name){toast(t('required'),'err');f.name.focus();return}
  const items=readChecklist(fd);
  const data={name,address:String(fd.get('address')||'').trim(),customerId:fd.get('customerId'),cleanerId:fd.get('cleanerId'),target:Math.max(0,Math.min(100,+fd.get('target')||0)),type:fd.get('type')||'',items};
  let s;if(id==='new'){s={id:uid('s'),...data};db.sites.push(s)}else{s=site(id);Object.assign(s,data)}
  if(draft&&draft.siteId===s.id){Object.keys(draft.items).forEach(k=>{if(!items[k])delete draft.items[k]});saveDraft()}
  if(!await (id==='new'?dbInsert('sites',s):dbUpdate('sites',{id:s.id,...data})))return;toast(t('savedOk'));location.hash='#/site/'+s.id},
 async delSite(id){if(!confirm(t('confirmDeleteSite')))return;const paths=db.inspections.filter(i=>i.siteId===id).flatMap(inspPhotos);db.issues.filter(x=>x.siteId===id).forEach(x=>paths.push(x.photo,x.afterPhoto));
  db.sites=db.sites.filter(s=>s.id!==id);db.inspections=db.inspections.filter(i=>i.siteId!==id);db.issues=db.issues.filter(x=>x.siteId!==id);if(draft?.siteId===id){draft=null;store.del(dkey())}if(!await dbDelete('sites',id))return;removePhotos(paths);location.hash='#/sites'},
 resetToType(){const sel=$('#sfY');const ty=db.types.find(y=>y.id===sel?.value);if(ty)$('#chkBox').innerHTML=checklistHtml(ty.items)},
 async saveType(id){const f=$('#typeForm');const fd=new FormData(f);const fi=String(fd.get('fi')||'').trim();if(!fi){toast(t('required'),'err');f.fi.focus();return}
  const data={fi,en:String(fd.get('en')||'').trim()||fi,items:readChecklist(fd)};let ok;if(id==='new'){const ty={id:uid('t'),...data};db.types.push(ty);ok=await dbInsert('site_types',ty)}else{Object.assign(db.types.find(y=>y.id===id),data);ok=await dbUpdate('site_types',{id,...data})}
  if(!ok)return;toast(t('savedOk'));location.hash='#/settings'},
 async delType(id){if(!confirm(t('confirmDelete')))return;db.types=db.types.filter(y=>y.id!==id);if(await dbDelete('site_types',id))location.hash='#/settings'},
 toggleAddCleaner(){ui.addCleaner=!ui.addCleaner;render();if(ui.addCleaner)$('#ncN')?.focus()},
 async addCleaner(){const n=$('#ncN').value.trim();if(!n){toast(t('required'),'err');return}const c={id:uid('k'),name:n,phone:$('#ncP').value.trim(),active:true};db.cleaners.push(c);
  if(!await dbInsert('cleaners',{id:c.id,name:c.name,active:true})||!await saveContact(c.id,c.phone))return;if(!sb)saveDb();ui.addCleaner=false;toast(t('savedOk'));render()},
 async saveCleaner(id){const c=db.cleaners.find(x=>x.id===id);const n=$('#ceN').value.trim();if(!n){toast(t('required'),'err');return}c.name=n;c.phone=$('#ceP').value.trim();c.active=$('#ceA').checked;
  if(!await dbUpdate('cleaners',{id,name:n,active:c.active})||!await saveContact(id,c.phone))return;toast(t('savedOk'));render()},
 print(){window.print()},
 csv(){const {cur}=reportData();const q=v=>{const s=String(v??'');return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[[t('date'),t('site'),t('customer'),t('cleaner'),t('inspector'),t('avgScore')+' %',t('area'),t('item'),'0-5',t('weight','').trim(),t('commentPh').split(':')[0]]];
  cur.forEach(i=>{const s=site(i.siteId);Object.entries(i.items).forEach(([k,x])=>rows.push([i.date,s.name,custName(s.customerId),cleanerName(i.cleanerId),i.inspector,fmtNum(i.score),areaName(item(k)?.area),itemName(k),x.s==null?t('na'):x.s,x.w,x.c||'']))});
  download(`eagle-eye-${ui.rmonth}${ui.repSite?'-'+norm(siteName(ui.repSite)).replace(/[^a-z0-9]+/g,'-'):''}.csv`,'﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')},
 async addItem(){const x={id:uid('i'),area:'general',w:5,pos:db.items.length,fi:T.fi.newItem,en:T.en.newItem};db.items.push(x);if(await dbInsert('items',x))render()},
 async addCustomer(){const c={id:uid('c'),name:t('newCustomer')};db.customers.push(c);if(await dbInsert('customers',c))render()},
 exportData(){download(`eagle-eye-data-${todayIso()}.json`,JSON.stringify(db),'application/json')},
 resetDemo(){if(!confirm(t('confirmReset')))return;db=seed();draft=null;store.del(dkey());saveDb();toast(t('savedOk'));render()},
 async loadDemoCloud(){if(db.sites.length||!confirm(t('loadDemoQ')))return;toast(t('loading'));const d=seed();
  try{for(const [tb,rows] of [['customers',d.customers],['cleaners',d.cleaners.map(({phone,...c})=>c)],['sites',d.sites],['inspections',d.inspections],['issues',d.issues]])for(let i=0;i<rows.length;i+=200){const {error}=await sb.from(tb).insert(rows.slice(i,i+200).map(toRow));if(error)throw error}
   await loadCloud();toast(t('savedOk'))}catch(e){dbFail(e);return}render()},
 async wipeCloud(){if(prompt(t('wipeQ'))!=='DELETE')return;const paths=db.inspections.flatMap(inspPhotos);db.issues.forEach(x=>paths.push(x.photo,x.afterPhoto));
  try{for(const tb of ['issues','inspections','sites','cleaners','customers']){const {error}=await sb.from(tb).delete().neq('id','');if(error)throw error}removePhotos(paths);draft=null;store.del(dkey());await loadCloud();toast(t('savedOk'))}catch(e){dbFail(e);return}render()},
 zoom(_,el){const o=document.createElement('div');o.className='overlay';const im=new Image();im.src=el.src;im.alt='';o.appendChild(im);o.onclick=()=>o.remove();document.body.appendChild(o)}
};
const C={
 siteType(el){if(el.dataset.new==='1'||confirm(t('applyTypeQ')))A.resetToType()},
 period(el){ui.period=el.value;render()},cmonth(el){ui.cmonth=el.value;render()},rmonth(el){ui.rmonth=el.value;render()},
 async itemPhoto(el){const f=el.files[0];if(!f)return;const id=el.dataset.id;try{const p=await resizeImage(f);const r=dItem(id);r.p=p;if(!saveDraft())delete r.p;refreshCard(id)}catch(e){toast(t('photoFail'),'err')}},
 async taskPhoto(el){const f=el.files[0];if(!f)return;try{ui.taskPhoto=await resizeImage(f);$('#taskPrev').innerHTML=`<img class="thumb" src="${ui.taskPhoto}" alt="">`}catch(e){toast(t('photoFail'),'err')}},
 async profile(el){const id=el.dataset.id,f=el.dataset.f,v=el.value.trim();const {data,error}=await sb.from('profiles').update({[f]:v||null}).eq('id',id).select('*');if(error||!data?.length){console.error(error);toast(t('saveFail'),'err');return}
  ui.profiles=ui.profiles.map(p=>p.id===id?data[0]:p);toast(t('savedOk'));if(f==='role')render()},
 async fbPhoto(el){const f=el.files[0];if(!f)return;try{ui.fbPhoto=await resizeImage(f);$('#fbPrev').innerHTML=`<img class="thumb" src="${ui.fbPhoto}" alt="">`}catch(e){toast(t('photoFail'),'err')}},
 async rule(el){const v=+el.value;if(el.value===''||!isFinite(v))return;db.settings[el.dataset.k]=v;if(await saveSettings())toast(t('savedOk'))},
 lib(el){const x=item(el.dataset.id);if(!x)return;const f=el.dataset.f;x[f]=f==='w'?Math.max(1,Math.min(20,+el.value||1)):el.value.trim()||x[f];dbUpdate('items',{id:x.id,[f]:x[f]})},
 cust(el){const c=db.customers.find(x=>x.id===el.dataset.id);if(c&&el.value.trim()){c.name=el.value.trim();dbUpdate('customers',{id:c.id,name:c.name})}},
 importFile(el){const f=el.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||o.v!==2||!['sites','inspections','issues','items','cleaners','customers'].every(k=>Array.isArray(o[k]))||!o.settings)throw 0;db=migrate(o);draft=null;store.del(dkey());saveDb();toast(t('importOk'));render()}catch(e){toast(t('importBad'),'err')}};fr.readAsText(f)}
};
const I={
 draftField(el){if(!draft)return;draft[el.dataset.f]=el.value;saveDraft()},
 itemComment(el){if(!draft)return;dItem(el.dataset.id).c=el.value;saveDraft()}
};
// while something is saving, further taps are ignored so nothing is submitted twice
let busy=false;
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(!fn)return;e.preventDefault();if(busy)return;const res=fn(el.dataset.arg,el,e);if(res?.then){busy=true;document.body.classList.add('busy');res.catch(console.error).finally(()=>{busy=false;document.body.classList.remove('busy')})}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&C[el.dataset.ch])C[el.dataset.ch](el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&I[el.dataset.in])I[el.dataset.in](el)});
document.addEventListener('click',e=>{if(e.target.classList?.contains('modal'))A.closeHelp()});document.addEventListener('keydown',e=>{if(e.key==='Escape')A.closeHelp()});
window.addEventListener('hashchange',()=>{ui.profiles=null;ui.taskOpen=null;render();window.scrollTo(0,0);refreshIfStale()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshIfStale()});
async function boot(){
 if(DEMO){if(session)loadDraft();render();return}
 if(sb){sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){ui.recovery=true;setTimeout(render,0)}});
  $('#app').innerHTML=`<div class="empty" style="padding-top:30vh">${t('loading')}</div>`;
  try{const {data}=await sb.auth.getSession();if(data.session)await enter(data.session.user)}catch(e){console.error(e);toast(t('setupMissing'),'err')}}
 render()}
boot();
</script>
</body>
