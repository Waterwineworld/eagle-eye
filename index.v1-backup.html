<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uusi Era – Laadunseuranta DEMO</title><style>:root{font-family:Arial,sans-serif;color:#153047;background:#f1f6f8}*{box-sizing:border-box}body{margin:0}header{background:#102d42;color:white;padding:20px}header h1{margin:0;font-size:23px}header small{color:#b4d8e0}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}button,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:#e6f0f3;color:#16394c}nav button{background:#244b5d;color:white}nav button.active,.primary{background:#087e96;color:white}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:white;border:1px solid #dce7ec;border-radius:14px;padding:17px;margin-bottom:13px}.metric{font-size:32px;font-weight:bold;margin:9px 0}.muted{color:#647785;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.checks{display:grid;gap:10px}.choice{display:flex;gap:7px;flex-wrap:wrap}.choice button.selected{background:#087e96;color:white}select,textarea{width:100%;padding:12px;border:1px solid #c8d6dd;border-radius:9px;background:white}label{display:block;font-weight:bold;margin-bottom:8px}.hidden{display:none}.pill{border-radius:20px;padding:5px 10px;background:#fff1ce;color:#765300;font-size:12px}.done{background:#dcf8eb;color:#09653e}footer{text-align:center;padding:20px;color:#657985;font-size:12px}h2{margin-top:0}#notice{color:#086845;font-weight:bold} @media(min-width:700px){.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}}</style></head><body><header><div class="row"><div><h1>◈ UUSI ERA | Laadunseuranta</h1><small>Jaettava interaktiivinen prototyyppi · DEMO</small></div><button onclick="toggleRole()" id="roleBtn">Esihenkilön näkymä</button></div><nav id="nav"></nav></header><main class="wrap"><section id="home"></section><section id="sites" class="hidden"></section><section id="inspection" class="hidden"></section><section id="issues" class="hidden"></section><section id="reports" class="hidden"></section></main><footer>Uusi Era Palvelut Oy · Esimerkkidata · Tiedot tallentuvat vain tämän selaimen paikalliseen muistiin, eivätkä synkronoidu käyttäjien välillä.</footer><script>
const locations=['Hervannan terveysasema','Hervannan kirjasto','Hatanpään sairaala'];const areas=['WC-tilat','Käytävät','Toimistot','Tauko- ja sosiaalitilat'];const checks=['Lattiapintojen puhtaus','Kosketuspinnat','Roska-astiat','Kalusteiden puhtaus','Saniteettikalusteet','Yleisilme'];let tab='home',role='manager',site=locations[0],area=areas[0],ratings={},notes='',issues=JSON.parse(localStorage.getItem('ue_issues')||'[]');const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem('ue_issues',JSON.stringify(issues))}function toggleRole(){role=role==='manager'?'customer':'manager';$('roleBtn').textContent=role==='manager'?'Esihenkilön näkymä':'Asiakkaan näkymä';if(role==='customer'&&['inspection','issues'].includes(tab))tab='home';render()}function go(t){tab=t;render()}function render(){let navs=[['home','Etusivu'],['sites','Kohteet'],['inspection','Laatukierros'],['issues','Poikkeamat'],['reports','Raportit']].filter(x=>role==='manager'||!['inspection','issues'].includes(x[0]));$('nav').innerHTML=navs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');for(let id of ['home','sites','inspection','issues','reports'])$(id).classList.toggle('hidden',tab!==id);renderHome();renderSites();renderInspection();renderIssues();renderReports()}
function renderHome(){$('home').innerHTML=`<h2>${role==='manager'?'Laadunseurannan yleiskatsaus':'Asiakkaan laatunäkymä'}</h2><p class="muted">Alla olevat laatuprosentit ovat esimerkkilukuja.</p><div class="grid">${[['22','Kohteita'],['94 %','Laatutaso (esimerkki)'],[String(issues.filter(x=>x.status==='Avoin').length),'Demon avoimet poikkeamat'],['18','Tarkastuksia (esimerkki)']].map(([n,l])=>`<div class="card"><div class="metric">${n}</div><div class="muted">${l}</div></div>`).join('')}</div><div class="card"><h3>Kohteiden laatutilanne</h3>${locations.map((s,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #eee"><strong>${s}</strong><span>${[96,92,90][i]} %</span></div>`).join('')}</div>${role==='manager'?'<button class="primary" onclick="go(\'inspection\')">+ Aloita laatukierros</button>':''}`}
function renderSites(){$('sites').innerHTML=`<h2>Kohteet</h2>${locations.map((s,i)=>`<div class="card"><div class="row"><div><strong>${s}</strong><div class="muted">Esimerkkilaatutaso ${[96,92,90][i]} %</div></div><button onclick="chooseSite(${i})">Valitse</button></div></div>`).join('')}<p>Valittu kohde: <strong>${esc(site)}</strong></p>${role==='manager'?'<button class="primary" onclick="go(\'inspection\')">Tee laatukierros</button>':'<button onclick="go(\'reports\')">Avaa raportit</button>'}`}
function chooseSite(i){site=locations[i];render()}
function chooseArea(i){area=areas[i];renderInspection()}
function rate(i,value){ratings[area+'|'+checks[i]]=value;renderInspection()}
function renderInspection(){let count=checks.filter(c=>ratings[area+'|'+c]).length;$('inspection').innerHTML=`<h2>Uusi laatukierros</h2><div class="card"><label>Kohde</label><select onchange="chooseSite(Number(this.value))">${locations.map((s,i)=>`<option value="${i}" ${site===s?'selected':''}>${s}</option>`).join('')}</select><br><br><label>Tarkastettava tila</label><select onchange="chooseArea(Number(this.value))">${areas.map((a,i)=>`<option value="${i}" ${area===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="row"><h3>${area}</h3><span>${count}/${checks.length} arvioitu</span></div><div class="checks">${checks.map((c,i)=>`<div class="card"><strong>${i+1}. ${c}</strong><div class="choice" style="margin-top:12px">${['Kunnossa','Korjattavaa','Ei koske'].map(v=>`<button class="${ratings[area+'|'+c]===v?'selected':''}" onclick="rate(${i},'${v}')">${v}</button>`).join('')}</div></div>`).join('')}</div><div class="card"><label>Lisätiedot</label><textarea id="notes" rows="4" placeholder="Havainnot ja korjaustarpeet">${esc(notes)}</textarea><p class="muted">Kuvien lisääminen vaatii jatkokehitystä.</p></div><button class="primary" ${count!==checks.length?'disabled':''} onclick="saveInspection()">Tallenna laatukierros</button><p id="notice"></p>`}
function saveInspection(){notes=$('notes').value;let problems=checks.filter(c=>ratings[area+'|'+c]==='Korjattavaa');issues.push(...problems.map(c=>({site,area,description:c,status:'Avoin',notes,date:new Date().toLocaleDateString('fi-FI')})));persist();$('notice').textContent=`Laatukierros tallennettu tähän selaimeen. ${problems.length} poikkeamaa lisätty.`}
function updateIssue(i){issues[i].status=issues[i].status==='Avoin'?'Korjattu':'Avoin';persist();render()}
function renderIssues(){$('issues').innerHTML=`<h2>Poikkeamat</h2>${issues.length?issues.map((x,i)=>`<div class="card"><div class="row"><strong>${esc(x.description)}</strong><span class="pill ${x.status==='Korjattu'?'done':''}">${x.status}</span></div><p class="muted">${esc(x.site)} · ${esc(x.area)} · ${esc(x.date)}</p><p>${esc(x.notes||'Ei lisätietoja')}</p><button onclick="updateIssue(${i})">${x.status==='Avoin'?'Merkitse korjatuksi':'Avaa uudelleen'}</button></div>`).join(''):'<div class="card">Ei vielä kirjattuja poikkeamia. Tee laatukierros ja valitse Korjattavaa.</div>'}`}
function reportText(){return `UUSI ERA PALVELUT OY – LAADUNSEURANNAN DEMORAPORTTI\nKohde: ${site}\nLaatutaso: 94 % (esimerkkiluku)\n\nPoikkeamat:\n${issues.filter(x=>x.site===site).map(x=>`${x.description}: ${x.status} (${x.date})`).join('\n')||'Ei kirjattuja poikkeamia'}`}function copyReport(){navigator.clipboard.writeText(reportText()).then(()=>alert('Raportti kopioitu')).catch(()=>alert('Kopiointi ei onnistunut'))}function downloadReport(){let blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uusi-era-laaturaportti.txt';a.click();URL.revokeObjectURL(a.href)}function renderReports(){$('reports').innerHTML=`<h2>Laatu- ja asiakasraportit</h2><div class="card"><label>Kohde</label><select onchange="chooseSite(Number(this.value))">${locations.map((s,i)=>`<option value="${i}" ${site===s?'selected':''}>${s}</option>`).join('')}</select><h3>Kuukausiraportin esikatselu</h3><div class="grid"><div class="card"><div class="metric">94 %</div><div class="muted">Laatutaso (esimerkki)</div></div><div class="card"><div class="metric">${issues.filter(x=>x.site===site&&x.status==='Avoin').length}</div><div class="muted">Avoimet poikkeamat tässä demossa</div></div></div><h4>Kirjatut poikkeamat</h4>${issues.filter(x=>x.site===site).map(x=>`<p>${esc(x.description)} – ${esc(x.status)}</p>`).join('')||'<p class="muted">Ei kirjattuja poikkeamia.</p>'}<button onclick="copyReport()">Kopioi raportti</button> <button class="primary" onclick="downloadReport()">Lataa raportti (.txt)</button></div>`}render();
</script></body></html>
